/* Photography-led layout for the wedding simulation. */
.masthead {
  display: grid;
  grid-template-columns: 1fr auto;
  min-height: 72px;
  background: var(--paper);
}

.masthead .brand { justify-self: start; padding: 0; min-height: 44px; border: 0; background: none; }
.masthead .text-button { justify-self: end; border-bottom: 1px solid var(--gold); }

.progress {
  max-width: none;
  padding-block: 11px;
  background: var(--ivory);
  border-bottom: 1px solid var(--line);
}
.progress ol { max-width: 1136px; margin-inline: auto; }
.progress li { padding-top: 5px; }

.hero { min-height: 0; }
.hero > .photo {
  grid-row: 1;
  min-height: 0;
  aspect-ratio: 4 / 3;
}
.hero > .photo img { object-position: center 55%; }
.hero-copy { gap: 13px; padding: 32px clamp(20px, 6vw, 64px) 37px; }
.hero h1 { font-size: clamp(2.9rem, 10vw, 6rem); }
.hero h2 { margin-top: 4px; }
.hero-copy .button { margin-top: 5px; }

.hero + .wrap .section-top { margin-bottom: 24px; }
.journey { gap: 0; border-top: 1px solid var(--line); }
.journey article {
  border: 0;
  border-bottom: 1px solid var(--line);
  background: transparent;
}

.features { gap: clamp(14px, 3vw, 32px); margin-top: clamp(28px, 5vw, 56px); }
.features article { display: grid; border: 0; background: var(--ivory); }
.features .photo { aspect-ratio: 5 / 4; }
.features .copy { padding: clamp(16px, 3vw, 28px); border-top: 2px solid var(--gold); }
.features h3 { line-height: 1.1; overflow-wrap: anywhere; }

.layout { column-gap: clamp(24px, 4vw, 56px); }
.layout .section-top { padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.package-cards .choice { min-height: 120px; padding: 16px 14px; align-content: center; }
.package-cards .choice .english { font-size: clamp(1.4rem, 3vw, 2.2rem); }
.detail { background: var(--paper); }
.detail .form-note { margin-top: 12px; }
.side { border: 0; border-top: 2px solid var(--gold); }
.side h2 { margin-top: 6px; }

@media (min-width: 600px) {
  .masthead { grid-template-columns: 1fr auto 1fr; }
  .masthead .header-name { justify-self: center; }
  .masthead .text-button { grid-column: 3; }
  .hero > .photo { aspect-ratio: 16 / 8; }
  .journey article + article { border-left: 1px solid var(--line); }
  .package-cards .choice { padding: 20px 23px; }
}

@media (min-width: 900px) {
  .hero {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(540px, min(74vh, 730px));
    position: relative;
    isolation: isolate;
  }
  .hero > .photo, .hero-copy { grid-area: 1 / 1; }
  .hero > .photo { aspect-ratio: auto; }
  .hero-copy {
    align-self: end;
    justify-self: start;
    z-index: 1;
    width: min(47%, 555px);
    margin: 0 0 clamp(24px, 5vh, 56px) clamp(30px, 6vw, 110px);
    padding: clamp(25px, 3vw, 47px);
    background: var(--green);
    color: var(--ivory);
    border-top: 2px solid var(--gold);
  }
  .hero-copy h1, .hero-copy h2, .hero-copy p { color: var(--ivory); }
  .hero-copy .eyebrow, .hero-copy .subtitle { color: #f5deb5; }
  .hero-copy h1 { font-size: clamp(3.1rem, 6.1vw, 6rem); }
  .hero-copy .button { background: var(--ivory); border-color: var(--ivory); color: var(--green); }
  .features article:nth-child(2) { margin-top: 48px; }
  .features article:first-child { margin-bottom: 48px; }
}

@media print {
  .progress, .masthead { display: none !important; }
  .layout .section-top { padding-bottom: 8px; }
}</style>

}
function summary(){
 return `<div class="receipt"><section class="panel"><h2>예약 신청 내용</h2>${rows(selected())}</section><div class="grid"><section class="panel"><h2>기본 포함 서비스</h2>${list(packageInfo().included)}</section><section class="panel"><h2>추가 선택 서비스</h2>${services().length?list(services()):'<p>추가 선택 없음</p>'}${saved.pkg===0&&(saved.dining||saved.memory)?restPaymentNote:''}</section></div>
 <div class="experience">${['dining','memory'].map(type=>`<section class="summary-feature">${preview(type)}${!enabled(type)?'<p class="form-note">시그니처 경험 예시 · 이번 신청에서 미선택</p>':''}</section>`).join('')}</div></div>`;
}
function review(){
 return header('Step 05 · Review','MY FIRST MOMENT','Our Wedding Eve, Our Story',true)+summary()+`<div class="actions">${button('선택 수정하기','edit',true)}${button('고객 정보 수정','back',true)}${button('예약 상담 신청하기 →','complete')}</div>`;
}
function complete(){
 return `<div class="success">${header('Step 06 · Consultation','Your First Moment Begins Here','두 사람만의 특별한 웨딩 이브를 위한 상담 신청이 준비되었습니다. 선택한 서비스 구성을 확인해 주세요.',true)}<p class="form-note">${description}</p><div class="number">가상 신청번호 ${number}</div>${summary()}
 <div class="actions">${button('인쇄하기','print')}${button('신청 내용 다운로드','download',true)}${button('처음부터 다시 선택하기','reset',true)}</div></div>`;
}
function sidebar(){
 const pkg=packageInfo();
 return `<aside class="side panel" aria-label="선택 요약"><div class="eyebrow">Your Wedding Eve</div><h2 class="english">${pkg?.name??'My First Moment'}</h2>${pkg?`<p>${pkg.title}</p>${list([saved.wellness.length?'웰니스 '+saved.wellness.length+'개':'',enabled('dining')?(dining[saved.style]?.[0]??'Our Story Dining'):'',enabled('memory')?'Letters to Tomorrow':''].filter(Boolean))}<p>가격 · 상담 후 안내</p>`:'<p>선택한 패키지가 여기에 표시됩니다.</p>'}</aside>`;
}
function refreshPreview(){
 document.querySelectorAll('[data-live]').forEach(node=>{
  const key=node.dataset.live;
  const feature=node.closest('[data-preview]').dataset.preview;
  const value=enabled(feature)?privateFields[key]?.trim():'';
  const prefix={story:'Our Story — ',song:'Music — '};
  node.textContent=value?(prefix[key]??'')+value:'';
 });
}
function render(){
 progress.innerHTML=`<span class="sr-only">현재 단계 ${step}. ${steps[step-1]}</span><ol>${steps.map((name,i)=>`<li ${step===i+1?'aria-current="step"':''} class="${step>i+1?'done':''}" aria-label="${i+1}. ${name}"><span>0${i+1}</span> <span class="step-name">${name}</span></li>`).join('')}</ol>`;
 const pages=[intro,packagePage,customize,schedule,review,complete];
 const content=pages[step-1]();
 main.innerHTML=step===1?content:`<div class="wrap layout"><div>${content}</div>${sidebar()}</div>`;
 document.querySelector('.masthead [data-action="start"]').hidden=step>2;
 refreshPreview();
}
function go(destination){
 step=destination;
 render();
 window.scrollTo(0,0);
 main.querySelector('h1')?.focus({preventScroll:true});
}
function choose(target){
 const key=target.dataset.choice;
 const value=Number(target.dataset.value);
 if(key==='pkg'){
  if(!packages[value]||saved.pkg===value) return;
  const prior=saved.pkg;
  const oldDining=enabled('dining');
  const oldMemory=enabled('memory');
  const before=[saved.dining,saved.memory];
  saved.pkg=value;
  saved.wellnessExtra=value===1&&saved.wellness.length>0;
  saved.dining=false;
  saved.memory=false;
  if(!enabled('dining')){
   saved.style=null;
   for(const field of ['food','avoid','allergy','drink','story','song','message']) delete privateFields[field];
  }
  if(!enabled('memory')){
   saved.keepsake=null;
   delete privateFields.engraving;
  }
  if(!enabled('dining')&&!enabled('memory')) delete privateFields.initials;
  const changes=[];
  if(prior===1) saved.storyMemory=null;
  if(prior!==null&&saved.morning.includes(0)&&(prior===1||value===1)) changes.push('차량 이동 항목의 제공 방식이 새 패키지에 맞게 변경되었습니다.');
  if(value===1){
   const availableWellness=storyWellness(saved.wellness);
   if(availableWellness.length<saved.wellness.length) changes.push('아로마 마사지와 사우나 중 먼저 선택한 항목을 유지했습니다.');
   saved.wellness=availableWellness;
   saved.keepsake=null;
   delete privateFields.engraving;
  }
  if(value===0&&oldDining) changes.push('다이닝 선택을 해제했습니다. 취향 구성에서 다시 추가할 수 있습니다.');
  if(value===0&&oldMemory) changes.push('기념함 선택을 해제했습니다. 취향 구성에서 다시 추가할 수 있습니다.');
  if(value!==0&&before.some(Boolean)) changes.push('추가한 시그니처 경험이 새 패키지의 기본 포함 서비스로 변경되었습니다.');
  if(saved.wellness.length&&prior!==null&&(prior===1)!==(value===1)) changes.push('웰니스의 포함 여부를 새 패키지에 맞게 업데이트했습니다.');
  notice=prior===null?'':packages[value].name+' 패키지로 변경했습니다. '+changes.join(' ');
 } else if(key==='wellness'||key==='morning'){
  const items=saved[key];
  saved[key]=items.includes(value)?items.filter(i=>i!==value):key==='wellness'&&saved.pkg===1&&value<2?[...items.filter(i=>i>=2),value]:[...items,value];
 } else if(key==='wellnessExtra'){
  saved.wellnessExtra=!saved.wellnessExtra;
  if(!saved.wellnessExtra) saved.wellness=[];
 } else if(key==='dining'||key==='memory'){
  saved[key]=!saved[key];
  if(!saved[key]){
   saved[key==='dining'?'style':'keepsake']=null;
   const fields=key==='dining'?['food','avoid','allergy','drink','story','song','message']:['engraving'];
   for(const field of fields) delete privateFields[field];
   if(!enabled('dining')&&!enabled('memory')) delete privateFields.initials;
  }
 } else {
  saved[key]=saved[key]===value?null:value;
 }
 storeChoices();
 render();
 main.querySelector(`[data-choice="${key}"][data-value="${value}"]`)?.focus({preventScroll:true});
 document.querySelector('#announcement').textContent=notice&&key==='pkg'?notice:'';
}
function download(){
 const lines=['THE FIRST MOMENT · 예약 상담 시뮬레이션','가상 신청번호 '+number,description,'',...selected().filter(([,value])=>value).map(([label,value])=>label+' · '+value),'','기본 포함 서비스',...packageInfo().included,'','추가 선택 서비스',...(services().length?services():['추가 선택 없음'])];
 const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'}));
 const anchor=document.createElement('a');
 anchor.href=url;
 anchor.download=number+'.txt';
 anchor.click();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
document.addEventListener('click',event=>{
 const target=event.target.closest('button');
 if(!target) return;
 if(target.dataset.choice){choose(target);return;}
 switch(target.dataset.action){
  case 'home': go(1); break;
  case 'start': go(2); break;
  case 'back': go(step-1); break;
  case 'next': if(packageInfo()&&step<4) go(step+1); break;
  case 'edit': go(3); break;
  case 'complete':
   number='TFM-'+Date.now().toString(36).toUpperCase();
   go(6);
   break;
  case 'print': window.print(); break;
  case 'download': download(); break;
  case 'reset':
   saved=blank(); privateFields={}; number=''; notice='';
   storeChoices(); go(1); break;
 }
});
function capture(event){
 if(!event.target.matches('input,textarea,select')) return;
 privateFields[event.target.name]=event.target.value;
 event.target.removeAttribute('aria-invalid');
 refreshPreview();
}
main.addEventListener('input',capture);
main.addEventListener('change',capture);
main.addEventListener('submit',event=>{
 if(event.target.id!=='schedule') return;
 event.preventDefault();
 const form=event.target;
 for(const input of form.elements){
  if(input.name) privateFields[input.name]=input.value.trim();
 }
 const required=[['name','대표 예약자명을 입력해 주세요.'],['phone','연락처를 입력해 주세요.'],['email','이메일을 입력해 주세요.'],['date','결혼식 예정일을 선택해 주세요.'],['time','예식 시작 시간을 선택해 주세요.'],['room','기존 객실 예약 여부를 선택해 주세요.']];
 const phone=privateFields.phone;
 const email=privateFields.email;
 const issue=required.find(([key])=>!privateFields[key])||
  (!/^\+?[0-9()\s-]+$/.test(phone)||!/^\d{9,15}$/.test(phone.replace(/\D/g,''))?['phone','연락처 형식을 확인해 주세요. 예. 010-1234-5678']:null)||
  (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)?['email','이메일 형식을 확인해 주세요. 예. example@example.com']:null);
 if(issue){
  const [key,message]=issue;
  const input=form.elements[key];
  input.setAttribute('aria-invalid','true');
  input.setAttribute('aria-describedby','error');
  document.querySelector('#error').textContent=message;
  input.focus();
  return;
 }
 go(5);
});
document.addEventListener('error',event=>{
 if(event.target instanceof HTMLImageElement) event.target.hidden=true;
},true);
render();
</script>
</body>
</html>
